[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "datasentinel"
version = "0.1.0"
description = "Automated Data Quality & Pipeline Monitoring Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "DataSentinel Team", email = "codeanova26@gmail.com"}
]
keywords = ["data-quality", "pipeline-monitoring", "schema-drift", "anomaly-detection", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0.0",
    "httpx>=0.25.0",
    "apscheduler>=3.10.0",
    "openpyxl>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.80.0",
    "mypy>=1.6.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
datasentinel = "datasentinel.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["datasentinel*"]

[tool.setuptools.package-data]
"datasentinel" = ["py.typed", "reports/templates/*.jinja"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=datasentinel --cov-report=term-missing"
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "reportlab.*",
    "apscheduler.*",
]
ignore_missing_imports = true
